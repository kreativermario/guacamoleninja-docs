name: Deploy (Portainer — disabled)

# Deployment is currently handled by Cloudflare Pages (free tier, fully static output).
# Cloudflare Pages auto-deploys from the main branch via its GitHub integration.
# Build command: pnpm build  |  Output directory: build
#
# To re-enable Portainer/Docker deployment:
#   1. Restore the push trigger below
#   2. Add required Vault secrets (see docs/getting-started/requirements.md)
#   3. Create the guacamoleninja-docs repository in Harbor
#
on:
  # push:
  #   branches: [main]
  workflow_dispatch:  # manual trigger only

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  STACK_NAME: guacamoleninja-docs
  VAULT_PORTAINER_PATH: automation/data/portainer

jobs:
  build-and-push:
    name: Build & push image
    runs-on: self-hosted
    environment: production
    timeout-minutes: 20
    outputs:
      tag:   ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Load Harbor credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.HCP_VAULT_ADDR }}
          method: approle
          roleId:   ${{ secrets.HCP_VAULT_ROLE_ID }}
          secretId: ${{ secrets.HCP_VAULT_SECRET_ID }}
          secrets: |
            ${{ vars.VAULT_PATH }} HARBOR_REGISTRY_URL | HARBOR_REGISTRY_URL ;
            ${{ vars.VAULT_PATH }} HARBOR_USERNAME     | HARBOR_USERNAME ;
            ${{ vars.VAULT_PATH }} HARBOR_PASSWORD     | HARBOR_PASSWORD

      - name: Compute image tag
        id: meta
        env:
          HARBOR_REGISTRY_URL: ${{ steps.vault.outputs.HARBOR_REGISTRY_URL }}
        run: |
          REGISTRY=$(echo "$HARBOR_REGISTRY_URL" | tr -d '\n\r' | sed 's|^https\?://||; s|/$||')
          if [ -z "$REGISTRY" ]; then
            echo "::error::HARBOR_REGISTRY_URL is empty after normalisation" && exit 1
          fi
          TAG=$(git rev-parse --short HEAD)
          echo "tag=$TAG"                                                               >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/guacamoleninja/guacamoleninja-docs:$TAG"               >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY"                                                    >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ steps.vault.outputs.HARBOR_USERNAME }}
          password: ${{ steps.vault.outputs.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build & push docs image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  deploy:
    name: Deploy to Portainer
    runs-on: self-hosted
    environment: production
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Load deploy secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.HCP_VAULT_ADDR }}
          method: approle
          roleId:   ${{ secrets.HCP_VAULT_ROLE_ID }}
          secretId: ${{ secrets.HCP_VAULT_SECRET_ID }}
          secrets: |
            ${{ env.VAULT_PORTAINER_PATH }} api_key               | PORTAINER_API_TOKEN ;
            ${{ vars.VAULT_PATH }}          PORTAINER_URL         | PORTAINER_URL ;
            ${{ vars.VAULT_PATH }}          PORTAINER_ENDPOINT_ID | PORTAINER_ENDPOINT_ID ;
            ${{ vars.VAULT_PATH }}          HARBOR_REGISTRY_URL   | HARBOR_REGISTRY_URL ;
            ${{ vars.VAULT_PATH }}          HOST_PORT             | HOST_PORT

      - name: Resolve image ref
        id: image
        env:
          HARBOR_REGISTRY_URL: ${{ steps.vault.outputs.HARBOR_REGISTRY_URL }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          REGISTRY=$(echo "$HARBOR_REGISTRY_URL" | tr -d '\n\r' | sed 's|^https\?://||; s|/$||')
          echo "ref=$REGISTRY/guacamoleninja/guacamoleninja-docs:$TAG" >> "$GITHUB_OUTPUT"

      - name: Read compose file
        id: compose
        run: |
          CONTENT=$(jq -Rs '.' < docker/docker-compose.prod.yml)
          echo "content=$CONTENT" >> "$GITHUB_OUTPUT"

      - name: Check if stack exists
        id: check_stack
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ steps.vault.outputs.PORTAINER_URL }}/api/stacks
          method: GET
          contentType: application/json
          customHeaders: '{"X-API-Key": "${{ steps.vault.outputs.PORTAINER_API_TOKEN }}"}'
          timeout: 30000

      - name: Extract stack ID
        id: stack
        env:
          STACK_RESPONSE: ${{ steps.check_stack.outputs.response }}
          ENDPOINT_ID:    ${{ steps.vault.outputs.PORTAINER_ENDPOINT_ID }}
        run: |
          STACK_ID=$(echo "$STACK_RESPONSE" | jq -r \
            --arg name "${{ env.STACK_NAME }}" \
            --arg eid  "$ENDPOINT_ID" \
            'first(.[] | select(.Name==$name and (.EndpointId|tostring)==$eid) | .Id) // ""' \
            | tr -d '\r\n')
          {
            echo "stack_id<<EOF"
            echo "$STACK_ID"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update existing stack
        if: steps.stack.outputs.stack_id != ''
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ steps.vault.outputs.PORTAINER_URL }}/api/stacks/${{ steps.stack.outputs.stack_id }}?endpointId=${{ steps.vault.outputs.PORTAINER_ENDPOINT_ID }}&method=string
          method: PUT
          contentType: application/json
          customHeaders: '{"X-API-Key": "${{ steps.vault.outputs.PORTAINER_API_TOKEN }}"}'
          timeout: 300000
          data: >-
            {
              "env": [
                {"name": "DOCS_IMAGE", "value": "${{ steps.image.outputs.ref }}"},
                {"name": "HOST_PORT",  "value": "${{ steps.vault.outputs.HOST_PORT }}"}
              ],
              "stackFileContent": ${{ steps.compose.outputs.content }},
              "prune": true,
              "pullImage": true
            }

      - name: Create new stack
        if: steps.stack.outputs.stack_id == ''
        uses: fjogeleit/http-request-action@v2
        with:
          url: ${{ steps.vault.outputs.PORTAINER_URL }}/api/stacks/create/standalone/string?endpointId=${{ steps.vault.outputs.PORTAINER_ENDPOINT_ID }}
          method: POST
          contentType: application/json
          customHeaders: '{"X-API-Key": "${{ steps.vault.outputs.PORTAINER_API_TOKEN }}"}'
          timeout: 300000
          data: >-
            {
              "env": [
                {"name": "DOCS_IMAGE", "value": "${{ steps.image.outputs.ref }}"},
                {"name": "HOST_PORT",  "value": "${{ steps.vault.outputs.HOST_PORT }}"}
              ],
              "name": "${{ env.STACK_NAME }}",
              "fromAppTemplate": false,
              "stackFileContent": ${{ steps.compose.outputs.content }}
            }

  purge-cache:
    name: Purge Cloudflare cache
    runs-on: self-hosted
    environment: production
    needs: deploy
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Load Cloudflare credentials from Vault
        id: vault
        continue-on-error: true
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.HCP_VAULT_ADDR }}
          method: approle
          roleId:   ${{ secrets.HCP_VAULT_ROLE_ID }}
          secretId: ${{ secrets.HCP_VAULT_SECRET_ID }}
          secrets: |
            ${{ vars.VAULT_PATH }} CF_ZONE_ID_DOCS | CF_ZONE_ID ;
            ${{ vars.VAULT_PATH }} CF_API_TOKEN     | CF_API_TOKEN

      - name: Purge by Cache-Tag (Enterprise)
        if: steps.vault.outputs.CF_ZONE_ID != '' && steps.vault.outputs.CF_API_TOKEN != ''
        continue-on-error: true
        env:
          ZONE_ID:  ${{ steps.vault.outputs.CF_ZONE_ID }}
          CF_TOKEN: ${{ steps.vault.outputs.CF_API_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"tags":["deploy"]}' | jq -e '.success'

      - name: Purge by URL
        if: steps.vault.outputs.CF_ZONE_ID != '' && steps.vault.outputs.CF_API_TOKEN != ''
        env:
          ZONE_ID:  ${{ steps.vault.outputs.CF_ZONE_ID }}
          CF_TOKEN: ${{ steps.vault.outputs.CF_API_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://docs.guacamoleninja.com/","https://docs.guacamoleninja.com/sitemap.xml"]}' \
            | jq -e '.success'
