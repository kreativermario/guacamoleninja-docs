server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security hardening ─────────────────────────────
    # Hide nginx version from Server header and error pages
    server_tokens off;

    # Limit to read-only methods — docs is a static site
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Limit request body (no forms on docs site)
    client_max_body_size 1k;

    # Security headers
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options             "DENY"                                always;
    add_header X-Content-Type-Options      "nosniff"                             always;
    add_header X-DNS-Prefetch-Control      "off"                                 always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin"                         always;
    add_header Cross-Origin-Resource-Policy "same-origin"                        always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
        always;

    # ── CORS — allow requests from any *.guacamoleninja.com subdomain ──
    set $cors_origin "";
    if ($http_origin ~* "^https://([a-z0-9\-]+\.)?guacamoleninja\.com$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type" always;
    add_header Vary "Origin" always;

    location = /options-preflight {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }
    }

    # ── Routing ────────────────────────────────────────
    # Docusaurus generates /path/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Caching ────────────────────────────────────────
    # Hashed assets (/_docusaurus/*, /assets/*) — 1 year immutable
    location ~* ^/(assets|_docusaurus)/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-apply security headers (add_header doesn't inherit in nested blocks)
        add_header X-Content-Type-Options  "nosniff"  always;
        add_header X-Frame-Options         "DENY"     always;
        access_log off;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control           "public, immutable" always;
        add_header X-Content-Type-Options  "nosniff"           always;
        add_header X-Frame-Options         "DENY"              always;
        access_log off;
    }

    # HTML pages — no cache so deploys land immediately
    location ~* \.html$ {
        add_header Cache-Control           "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options  "nosniff"  always;
        add_header X-Frame-Options         "DENY"     always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Error pages ────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    # ── Gzip ───────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    text/javascript image/svg+xml;
}
